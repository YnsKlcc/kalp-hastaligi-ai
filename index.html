<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Muayene - Klinik AI</title>

    <link rel="stylesheet" href="/static/inter.css">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/tailwind.css">

    <script src="/static/vendor/lucide.min.js"></script>
    <script src="/static/app.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">

    <main class="min-h-screen px-4 pb-16 pt-20 sm:px-6 lg:ml-64 lg:px-10 lg:pt-10">
        <div class="mx-auto max-w-7xl">

            <header class="mb-8 border-b border-slate-200/70 pb-6">
                <h1 class="text-2xl font-semibold tracking-tight text-slate-900 sm:text-[28px]">Yeni Muayene</h1>
                <p class="mt-2 max-w-3xl text-[15px] leading-relaxed text-slate-500">
                    Yapay zeka destekli kardiyolojik risk analizi için hasta bulgularını giriniz.
                </p>
            </header>

            <div class="grid grid-cols-1 gap-6 lg:grid-cols-3 lg:items-start">

            <form id="muayeneFormu" onsubmit="tahminYap(event)" class="space-y-5 lg:col-span-2">

                <!-- Bölüm 1: Hasta kimliği -->
                <section class="rounded-2xl border border-slate-200/80 bg-white shadow-lg shadow-slate-200/60">
                    <div class="flex items-center gap-3 border-b border-slate-100 px-5 py-4 sm:px-6">
                        <span class="flex h-9 w-9 flex-none items-center justify-center rounded-xl bg-blue-50 text-blue-600 ring-1 ring-inset ring-blue-100">
                            <i data-lucide="user-round" class="h-[18px] w-[18px]"></i>
                        </span>
                        <h2 class="text-[15px] font-semibold tracking-tight text-slate-900">Hasta Bilgileri</h2>
                    </div>
                    <div class="grid grid-cols-1 gap-5 p-5 sm:grid-cols-2 sm:px-6">
                        <div class="flex flex-col gap-1.5">
                            <label for="ad" class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">Ad</label>
                            <div class="group relative">
                                <i data-lucide="user-round" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400 transition-colors duration-200 group-focus-within:text-blue-600"></i>
                                <input id="ad" type="text" name="ad" placeholder="Hastanın adı" autocomplete="off" required
                                       class="w-full py-2.5 pl-10 pr-3.5 placeholder:text-slate-400 rounded-xl border border-slate-200 bg-gray-50 text-[15px] text-slate-900 outline-none transition-all duration-200 hover:border-blue-300 hover:bg-white hover:ring-2 hover:ring-blue-500/10 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/40">
                            </div>
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label for="soyad" class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">Soyad</label>
                            <div class="group relative">
                                <i data-lucide="id-card" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400 transition-colors duration-200 group-focus-within:text-blue-600"></i>
                                <input id="soyad" type="text" name="soyad" placeholder="Hastanın soyadı" autocomplete="off" required
                                       class="w-full py-2.5 pl-10 pr-3.5 placeholder:text-slate-400 rounded-xl border border-slate-200 bg-gray-50 text-[15px] text-slate-900 outline-none transition-all duration-200 hover:border-blue-300 hover:bg-white hover:ring-2 hover:ring-blue-500/10 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/40">
                            </div>
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label for="age" class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">Yaş</label>
                            <div class="group relative">
                                <i data-lucide="calendar-days" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400 transition-colors duration-200 group-focus-within:text-blue-600"></i>
                                <input id="age" type="number" name="age" value="55" min="1" max="120" required
                                       class="w-full py-2.5 pl-10 pr-3.5 rounded-xl border border-slate-200 bg-gray-50 text-[15px] text-slate-900 outline-none transition-all duration-200 hover:border-blue-300 hover:bg-white hover:ring-2 hover:ring-blue-500/10 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/40">
                            </div>
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label for="sex" class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">Cinsiyet</label>
                            <div class="group relative">
                                <i data-lucide="users-round" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400 transition-colors duration-200 group-focus-within:text-blue-600"></i>
                                <select id="sex" name="sex" class="select-ok w-full appearance-none py-2.5 pl-10 pr-9 rounded-xl border border-slate-200 bg-gray-50 text-[15px] text-slate-900 outline-none transition-all duration-200 hover:border-blue-300 hover:bg-white hover:ring-2 hover:ring-blue-500/10 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/40">

                                </select>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Bölüm 2: Temel klinik bulgular -->
                <section class="rounded-2xl border border-slate-200/80 bg-white shadow-lg shadow-slate-200/60">
                    <div class="flex items-center gap-3 border-b border-slate-100 px-5 py-4 sm:px-6">
                        <span class="flex h-9 w-9 flex-none items-center justify-center rounded-xl bg-emerald-50 text-emerald-600 ring-1 ring-inset ring-emerald-100">
                            <i data-lucide="stethoscope" class="h-[18px] w-[18px]"></i>
                        </span>
                        <h2 class="text-[15px] font-semibold tracking-tight text-slate-900">Temel Bulgular</h2>
                    </div>
                    <div class="grid grid-cols-1 gap-5 p-5 sm:grid-cols-2 sm:px-6">
                        <div class="flex flex-col gap-1.5">
                            <label for="cp" class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">Göğüs Ağrısı Tipi (Cp)</label>
                            <div class="group relative">
                                <i data-lucide="heart-pulse" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400 transition-colors duration-200 group-focus-within:text-blue-600"></i>
                                <select id="cp" name="cp" class="select-ok w-full appearance-none py-2.5 pl-10 pr-9 rounded-xl border border-slate-200 bg-gray-50 text-[15px] text-slate-900 outline-none transition-all duration-200 hover:border-blue-300 hover:bg-white hover:ring-2 hover:ring-blue-500/10 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/40">
                                    <option value="typical angina">Tipik Anjina</option>
                                    <option value="atypical angina">Atipik Anjina</option>
                                    <option value="non-anginal">Anjinal Olmayan</option>
                                    <option value="asymptomatic">Semptomsuz</option>
                                </select>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label for="trestbps" class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">Tansiyon (Trestbps)</label>
                            <div class="group relative">
                                <i data-lucide="gauge" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400 transition-colors duration-200 group-focus-within:text-blue-600"></i>
                                <input id="trestbps" type="number" name="trestbps" value="140" min="50" max="260" required
                                       class="w-full py-2.5 pl-10 pr-3.5 rounded-xl border border-slate-200 bg-gray-50 text-[15px] text-slate-900 outline-none transition-all duration-200 hover:border-blue-300 hover:bg-white hover:ring-2 hover:ring-blue-500/10 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/40">
                            </div>
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label for="chol" class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">Kolesterol (Chol)</label>
                            <div class="group relative">
                                <i data-lucide="droplets" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400 transition-colors duration-200 group-focus-within:text-blue-600"></i>
                                <input id="chol" type="number" name="chol" value="240" min="0" max="700" required
                                       class="w-full py-2.5 pl-10 pr-3.5 rounded-xl border border-slate-200 bg-gray-50 text-[15px] text-slate-900 outline-none transition-all duration-200 hover:border-blue-300 hover:bg-white hover:ring-2 hover:ring-blue-500/10 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/40">
                            </div>
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label for="fbs" class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">Açlık Şekeri &gt; 120</label>
                            <div class="group relative">
                                <i data-lucide="candy" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400 transition-colors duration-200 group-focus-within:text-blue-600"></i>
                                <select id="fbs" name="fbs" class="select-ok w-full appearance-none py-2.5 pl-10 pr-9 rounded-xl border border-slate-200 bg-gray-50 text-[15px] text-slate-900 outline-none transition-all duration-200 hover:border-blue-300 hover:bg-white hover:ring-2 hover:ring-blue-500/10 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/40">
                                    <option value="False">Hayır</option>
                                    <option value="True">Evet</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Bölüm 3: EKG ve efor testi -->
                <section class="rounded-2xl border border-slate-200/80 bg-white shadow-lg shadow-slate-200/60">
                    <div class="flex items-center gap-3 border-b border-slate-100 px-5 py-4 sm:px-6">
                        <span class="flex h-9 w-9 flex-none items-center justify-center rounded-xl bg-violet-50 text-violet-600 ring-1 ring-inset ring-violet-100">
                            <i data-lucide="activity" class="h-[18px] w-[18px]"></i>
                        </span>
                        <h2 class="text-[15px] font-semibold tracking-tight text-slate-900">EKG ve Efor Testi</h2>
                    </div>
                    <div class="grid grid-cols-1 gap-5 p-5 sm:grid-cols-2 sm:px-6">
                        <div class="flex flex-col gap-1.5">
                            <label for="restecg" class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">EKG Sonucu</label>
                            <div class="group relative">
                                <i data-lucide="activity" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400 transition-colors duration-200 group-focus-within:text-blue-600"></i>
                                <select id="restecg" name="restecg" class="select-ok w-full appearance-none py-2.5 pl-10 pr-9 rounded-xl border border-slate-200 bg-gray-50 text-[15px] text-slate-900 outline-none transition-all duration-200 hover:border-blue-300 hover:bg-white hover:ring-2 hover:ring-blue-500/10 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/40">
                                    <option value="normal">Normal</option>
                                    <option value="st-t abnormality">ST-T Anormalliği</option>
                                    <option value="lv hypertrophy">LV Hipertrofisi</option>
                                </select>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label for="thalch" class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">Maks. Kalp Atışı</label>
                            <div class="group relative">
                                <i data-lucide="heart" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400 transition-colors duration-200 group-focus-within:text-blue-600"></i>
                                <input id="thalch" type="number" name="thalch" value="150" min="50" max="250" required
                                       class="w-full py-2.5 pl-10 pr-3.5 rounded-xl border border-slate-200 bg-gray-50 text-[15px] text-slate-900 outline-none transition-all duration-200 hover:border-blue-300 hover:bg-white hover:ring-2 hover:ring-blue-500/10 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/40">
                            </div>
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label for="exang" class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">Egzersiz Ağrısı</label>
                            <div class="group relative">
                                <i data-lucide="footprints" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400 transition-colors duration-200 group-focus-within:text-blue-600"></i>
                                <select id="exang" name="exang" class="select-ok w-full appearance-none py-2.5 pl-10 pr-9 rounded-xl border border-slate-200 bg-gray-50 text-[15px] text-slate-900 outline-none transition-all duration-200 hover:border-blue-300 hover:bg-white hover:ring-2 hover:ring-blue-500/10 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/40">
                                    <option value="False">Yok</option>
                                    <option value="True">Var</option>
                                </select>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label for="oldpeak" class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">ST Depresyonu</label>
                            <div class="group relative">
                                <i data-lucide="trending-down" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400 transition-colors duration-200 group-focus-within:text-blue-600"></i>
                                <input id="oldpeak" type="number" step="0.1" name="oldpeak" value="1.5" min="-3" max="10" required
                                       class="w-full py-2.5 pl-10 pr-3.5 rounded-xl border border-slate-200 bg-gray-50 text-[15px] text-slate-900 outline-none transition-all duration-200 hover:border-blue-300 hover:bg-white hover:ring-2 hover:ring-blue-500/10 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/40">
                            </div>
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label for="slope" class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">Eğim (Slope)</label>
                            <div class="group relative">
                                <i data-lucide="trending-up" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400 transition-colors duration-200 group-focus-within:text-blue-600"></i>
                                <select id="slope" name="slope" class="select-ok w-full appearance-none py-2.5 pl-10 pr-9 rounded-xl border border-slate-200 bg-gray-50 text-[15px] text-slate-900 outline-none transition-all duration-200 hover:border-blue-300 hover:bg-white hover:ring-2 hover:ring-blue-500/10 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/40">
                                    <option value="upsloping">Yukarı Eğimli</option>
                                    <option value="flat">Düz</option>
                                    <option value="downsloping">Aşağı Eğimli</option>
                                </select>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label for="ca" class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">Damar Sayısı (CA)</label>
                            <div class="group relative">
                                <i data-lucide="git-branch" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400 transition-colors duration-200 group-focus-within:text-blue-600"></i>
                                <input id="ca" type="number" name="ca" value="0" min="0" max="3" required
                                       class="w-full py-2.5 pl-10 pr-3.5 rounded-xl border border-slate-200 bg-gray-50 text-[15px] text-slate-900 outline-none transition-all duration-200 hover:border-blue-300 hover:bg-white hover:ring-2 hover:ring-blue-500/10 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/40">
                            </div>
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label for="thal" class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">Talasemi</label>
                            <div class="group relative">
                                <i data-lucide="scan-heart" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400 transition-colors duration-200 group-focus-within:text-blue-600"></i>
                                <select id="thal" name="thal" class="select-ok w-full appearance-none py-2.5 pl-10 pr-9 rounded-xl border border-slate-200 bg-gray-50 text-[15px] text-slate-900 outline-none transition-all duration-200 hover:border-blue-300 hover:bg-white hover:ring-2 hover:ring-blue-500/10 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/40">
                                    <option value="normal">Normal</option>
                                    <option value="fixed defect">Sabit Kusur</option>
                                    <option value="reversable defect">Tersine Çevrilebilir</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </section>

                <div class="flex justify-end">
                    <button type="submit" class="inline-flex items-center justify-center gap-2 w-full bg-gradient-to-r from-blue-600 to-indigo-600 px-7 py-3.5 text-white shadow-lg shadow-blue-600/30 transition-all duration-200 hover:scale-105 hover:from-blue-500 hover:to-indigo-500 hover:shadow-xl hover:shadow-blue-600/40 focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 sm:w-auto rounded-xl">
                        <i data-lucide="brain-circuit" class="h-4 w-4"></i>
                        <span>Yapay Zeka İle Analiz Et</span>
                    </button>
                </div>
            </form>

            <aside class="lg:sticky lg:top-4">
                <div id="panelBosDurum" class="rounded-2xl border border-dashed border-slate-300 bg-white/60 p-8 text-center shadow-sm">
                    <span class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-blue-50 to-indigo-50 text-blue-600 ring-1 ring-inset ring-blue-100">
                        <i data-lucide="brain-circuit" class="h-6 w-6"></i>
                    </span>
                    <p class="text-[15px] font-semibold tracking-tight text-slate-700">Yapay Zeka Sonuç Paneli</p>
                    <p class="mx-auto mt-2 max-w-[26ch] text-[13px] leading-relaxed text-slate-500">
                        Hasta bulgularını girip analizi başlattığınızda teşhis, risk oranı ve
                        klinik rapor burada görüntülenir.
                    </p>
                </div>
                <div id="sonucKutusu" hidden></div>
            </aside>

            </div>
        </div>
    </main>

<script>
    let hastaGeciciVeri = {};
    const ISKELET_ASGARI_MS = 900;
    const bekle = (ms) => new Promise(cozumle => setTimeout(cozumle, ms));

    function iskeletGoster(kutu) {
        const cizgi = (sinif) => { const d = document.createElement('div'); d.className = 'rounded bg-slate-200 ' + sinif; return d; };
        const kutucuk = (sinif) => { const d = document.createElement('div'); d.className = 'rounded-xl bg-slate-100 ' + sinif; return d; };

        const yukleyici = document.createElement('span');
        yukleyici.className = 'flex h-11 w-11 flex-none items-center justify-center rounded-xl bg-white text-blue-600 shadow-sm ring-1 ring-inset ring-blue-200';
        yukleyici.appendChild(ikonYarat('loader-circle', 'h-[22px] w-[22px] animate-spin'));

        const basliklar = document.createElement('div'); basliklar.className = 'min-w-0';
        const etiket = document.createElement('div'); etiket.className = 'text-[11px] font-semibold uppercase tracking-wider text-blue-500'; etiket.textContent = 'Analiz Sürüyor';
        const baslik = document.createElement('p'); baslik.className = 'text-[15px] font-bold tracking-tight text-slate-700'; baslik.textContent = 'Yapay zeka verileri işliyor…';
        basliklar.append(etiket, baslik);

        const serit = document.createElement('div'); serit.className = 'flex items-center gap-4 border-b border-blue-100 bg-gradient-to-r from-blue-50 to-indigo-50/60 px-5 py-4 sm:px-6'; serit.append(yukleyici, basliklar);

        const risk = document.createElement('div'); risk.append(cizgi('h-3 w-2/5'), Object.assign(cizgi('mt-3 h-2 w-full'), {}));
        const govde = document.createElement('div'); govde.className = 'animate-pulse space-y-6 p-5 sm:p-6';
        govde.append(risk, kutucuk('h-16 w-full'), (() => { const blok = document.createElement('div'); blok.append(cizgi('h-2.5 w-1/3'), kutucuk('mt-2 h-28 w-full')); return blok; })(), kutucuk('h-24 w-full'), kutucuk('h-11 w-full'));

        kutu.hidden = false; kutu.className = 'overflow-hidden rounded-2xl border border-blue-200/80 bg-white shadow-lg shadow-blue-200/40';
        kutu.replaceChildren(serit, govde); ikonlariYenile();
    }

    async function tahminYap(event) {
        event.preventDefault();
        const buton = event.target.querySelector('button[type="submit"]');
        const butonIcerigi = buton.innerHTML;
        buton.disabled = true; buton.textContent = 'Analiz ediliyor…';

        const kutu = document.getElementById('sonucKutusu');
        const bosDurum = document.getElementById('panelBosDurum');
        if (bosDurum) bosDurum.hidden = true;
        iskeletGoster(kutu);

        const baslangic = Date.now();

        try {
            const veri = Object.fromEntries(new FormData(event.target).entries());
            const sonuc = await apiIstek('/tahmin', { govde: veri });

            const gecen = Date.now() - baslangic;
            if (gecen < ISKELET_ASGARI_MS) await bekle(ISKELET_ASGARI_MS - gecen);

            hastaGeciciVeri = veri;
            hastaGeciciVeri.teshis = sonuc['Teşhis Sonucu'];
            hastaGeciciVeri.risk = sonuc['Kalp Hastalığı Risk Oranı'];
            hastaGeciciVeri.aciklama = sonuc['Yapay Zeka Açıklaması'];
            hastaGeciciVeri.id = sonuc.hasta_id;
            hastaGeciciVeri.pdf_jetonu = sonuc.pdf_jetonu;

            sonucGoster(kutu, sonuc);
        } catch (err) {
            const gecen = Date.now() - baslangic;
            if (gecen < ISKELET_ASGARI_MS) await bekle(ISKELET_ASGARI_MS - gecen);
            kutu.hidden = false; kutu.className = 'rounded-2xl border border-amber-200/80 bg-white p-5 shadow-lg shadow-amber-100/50 sm:p-6';
            const dogrudan = err.name === 'YetkiHatasi' || err.name === 'HizSiniriHatasi';
            const uyari = document.createElement('p'); uyari.className = 'flex items-start gap-2.5 text-[13px] leading-relaxed text-amber-900';
            uyari.append(ikonYarat(err.name === 'HizSiniriHatasi' ? 'timer-off' : 'alert-triangle', 'mt-0.5 h-4 w-4 flex-none text-amber-600'), Object.assign(document.createElement('span'), { textContent: dogrudan ? err.message : 'Analiz sırasında bir sorun oluştu: ' + err.message }));
            kutu.replaceChildren(uyari); ikonlariYenile();
        } finally {
            buton.disabled = false; buton.innerHTML = butonIcerigi; ikonlariYenile();
        }
    }

    const SONUC_STILI = {
        riskli: { kart: 'mt-6 overflow-hidden rounded-2xl border border-red-200/80 bg-white shadow-lg shadow-red-200/40', serit: 'flex items-center gap-4 border-b border-red-100 bg-gradient-to-r from-red-50 to-orange-50/60 px-5 py-4 sm:px-6', ikonKutu: 'flex h-11 w-11 flex-none items-center justify-center rounded-xl bg-white text-red-600 shadow-sm ring-1 ring-inset ring-red-200', etiket: 'text-[11px] font-semibold uppercase tracking-wider text-red-500', baslik: 'text-lg font-bold tracking-tight text-red-700 sm:text-xl', oran: 'text-base font-bold text-red-600', dolgu: 'h-full rounded-full bg-gradient-to-r from-red-500 to-red-600 transition-all duration-700 ease-out', ikon: 'alert-triangle' },
        saglikli: { kart: 'mt-6 overflow-hidden rounded-2xl border border-emerald-200/80 bg-white shadow-lg shadow-emerald-200/40', serit: 'flex items-center gap-4 border-b border-emerald-100 bg-gradient-to-r from-emerald-50 to-teal-50/60 px-5 py-4 sm:px-6', ikonKutu: 'flex h-11 w-11 flex-none items-center justify-center rounded-xl bg-white text-emerald-600 shadow-sm ring-1 ring-inset ring-emerald-200', etiket: 'text-[11px] font-semibold uppercase tracking-wider text-emerald-600', baslik: 'text-lg font-bold tracking-tight text-emerald-700 sm:text-xl', oran: 'text-base font-bold text-emerald-600', dolgu: 'h-full rounded-full bg-gradient-to-r from-emerald-500 to-teal-500 transition-all duration-700 ease-out', ikon: 'check-circle-2' }
    };

    function sonucGoster(kutu, sonuc) {
        const teshis = sonuc['Teşhis Sonucu']; const risk = sonuc['Kalp Hastalığı Risk Oranı']; const stil = riskliMi(teshis) ? SONUC_STILI.riskli : SONUC_STILI.saglikli;
        kutu.hidden = false; kutu.className = stil.kart;
        const yarat = (etiket, sinif, metin) => { const dugum = document.createElement(etiket); if (sinif) dugum.className = sinif; if (metin !== undefined) dugum.textContent = metin; return dugum; };

        const ikonKutusu = yarat('span', stil.ikonKutu); ikonKutusu.setAttribute('aria-hidden', 'true'); ikonKutusu.appendChild(ikonYarat(stil.ikon, 'h-[22px] w-[22px]'));
        const basliklar = yarat('div', 'min-w-0'); basliklar.append(yarat('div', stil.etiket, 'Yapay Zeka Teşhisi'), yarat('h2', stil.baslik, teshis));
        const serit = yarat('div', stil.serit); serit.append(ikonKutusu, basliklar);

        const govde = yarat('div', 'space-y-6 p-5 sm:p-6');
        const oranUst = yarat('div', 'flex items-baseline justify-between gap-3'); oranUst.append(yarat('span', 'text-[13px] font-medium text-slate-500', 'Kalp hastalığı risk oranı'), yarat('b', stil.oran, risk));
        const dolgu = yarat('div', stil.dolgu); dolgu.style.width = oranSayisi(risk) + '%';
        const cubuk = yarat('div', 'mt-2 h-2 w-full overflow-hidden rounded-full bg-slate-100'); cubuk.appendChild(dolgu);
        const oranBlok = yarat('div'); oranBlok.append(oranUst, cubuk);

        const aciklama = yarat('p', 'flex items-start gap-2.5 rounded-xl border border-amber-200/70 bg-amber-50/70 px-4 py-3 text-[13px] leading-relaxed text-amber-900'); aciklama.append(ikonYarat('info', 'mt-0.5 h-4 w-4 flex-none text-amber-600'), yarat('span', null, sonuc['Yapay Zeka Açıklaması']));
        const klinikBlok = yarat('div'); klinikBlok.append(yarat('div', 'mb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-500', 'Klinik Rapor ve Tavsiye'), yarat('pre', 'max-h-80 overflow-y-auto whitespace-pre-wrap break-words rounded-xl border border-slate-200 bg-slate-50/80 p-4 font-sans text-[13px] leading-relaxed text-slate-600', sonuc['Klinik Rapor ve Tavsiye']));

        const dogruBtn = yarat('button', 'inline-flex flex-1 items-center justify-center gap-2 rounded-xl border border-emerald-200 bg-white px-4 py-2.5 text-[13px] font-semibold text-emerald-700 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:border-emerald-300 hover:bg-emerald-50 hover:shadow-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500 focus-visible:ring-offset-2');
        dogruBtn.type = 'button'; dogruBtn.append(ikonYarat('thumbs-up', 'h-4 w-4'), yarat('span', null, 'Doğru Teşhis'));
        dogruBtn.addEventListener('click', () => { window.geribildirimGonder(hastaGeciciVeri.id, hastaGeciciVeri.teshis, 'Doğru', document.getElementById('feedbackMesaj')); });

        const yanlisBtn = yarat('button', 'inline-flex flex-1 items-center justify-center gap-2 rounded-xl border border-red-200 bg-white px-4 py-2.5 text-[13px] font-semibold text-red-700 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:border-red-300 hover:bg-red-50 hover:shadow-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500 focus-visible:ring-offset-2');
        yanlisBtn.type = 'button'; yanlisBtn.append(ikonYarat('thumbs-down', 'h-4 w-4'), yarat('span', null, 'Yanlış (Düzelt)'));
        yanlisBtn.addEventListener('click', () => { window.geribildirimGonder(hastaGeciciVeri.id, hastaGeciciVeri.teshis, 'Yanlış', document.getElementById('feedbackMesaj')); });

        const butonlar = yarat('div', 'mt-3 flex flex-col gap-2.5 sm:flex-row'); butonlar.append(dogruBtn, yanlisBtn);
        const feedbackMesaj = yarat('p', 'mt-3 rounded-lg bg-slate-100 px-3.5 py-2.5 text-[13px] font-medium text-slate-600'); feedbackMesaj.id = 'feedbackMesaj'; feedbackMesaj.hidden = true;
        const feedback = yarat('div', 'rounded-xl border border-slate-200 bg-slate-50/60 p-4'); feedback.append(yarat('p', 'text-[13px] font-semibold text-slate-700', 'Uzman görüşü (yeniden eğitim için): Yapay zekanın teşhisi doğru mu?'), butonlar, feedbackMesaj);

        const pdfBtn = yarat('button', 'inline-flex w-full items-center justify-center gap-2 rounded-xl border border-slate-300 bg-white px-5 py-3 text-sm font-semibold text-slate-700 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:border-slate-400 hover:bg-slate-50 hover:shadow-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2');
        pdfBtn.type = 'button'; pdfBtn.append(ikonYarat('download', 'h-4 w-4'), yarat('span', null, 'Raporu PDF Olarak İndir'));
        pdfBtn.addEventListener('click', () => { window.raporIndir(hastaGeciciVeri.id, hastaGeciciVeri.pdf_jetonu); });

        govde.append(oranBlok, aciklama, klinikBlok, feedback, pdfBtn);
        kutu.replaceChildren(serit, govde); ikonlariYenile();
    }
</script>
